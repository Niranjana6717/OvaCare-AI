# OvaCare AI — local development stack
#
# ML inference runs IN-PROCESS inside the backend container (app/ml/) rather
# than as its own service: requirement #38's actual rule is that the
# frontend must never contain production ML logic, which this satisfies —
# see docs/architecture.md "ML service separation" for the reasoning and for
# how app/ml/ is structured so it could be split into its own deployment
# later without an API-contract change.
#
# Usage: docker compose up --build
# (Note: this compose file was written and its YAML validated with
# `docker compose config` in this project's development sandbox, but a full
# `docker compose up` could not be run there — the sandbox's Docker daemon
# itself doesn't start in that nested-container environment. See
# docs/deployment.md.)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ovacare
      POSTGRES_PASSWORD: ovacare_dev_password
      POSTGRES_DB: ovacare_db
    ports:
      - "5432:5432"
    volumes:
      - ovacare_postgres_data:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovacare -d ovacare_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://ovacare:ovacare_dev_password@db:5432/ovacare_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      API_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      MODEL_PATH: /app/ml-platform/models/production
    volumes:
      - ./ml-platform/models:/app/ml-platform/models:ro
    ports:
      - "8000:8000"

  # Reverse proxy + static file host for apps/web and admin/dashboard
  # (infrastructure/nginx/). Optional for local dev — the web/admin apps
  # have no build step, so `apps/web/src/index.html` can just be opened
  # directly, or served by any static server, while pointing at
  # http://localhost:8000/api/v1 (see apps/web/src/config.js). This
  # service exists so a deployment can serve all three surfaces
  # same-origin behind one address instead.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./apps/web/src:/usr/share/nginx/web:ro
      - ./admin/dashboard:/usr/share/nginx/admin:ro

volumes:
  ovacare_postgres_data:
