name: ML pipeline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-platform/requirements.txt

      - name: Install dependencies
        # XGBoost and SHAP are both wrapped in try/except ImportError in
        # src/train.py and src/explain.py respectively (see their
        # docstrings) — if either fails to install on a given runner, the
        # pipeline still runs and falls back correctly, but on GitHub's
        # normal-internet runners both should install fine, unlike this
        # project's original dev sandbox.
        run: pip install -r requirements.txt

      - name: Run the pipeline smoke suite
        run: python -m pytest tests/ -v

      - name: Verify the real dataset is NOT required for these tests
        # These tests run entirely against the synthetic, clearly-labeled
        # fixture in tests/test_pipeline_smoke.py (_make_synthetic_raw_df)
        # — they prove the pipeline's LOGIC (schema handling, leakage
        # guards, unexpected-value rejection) without asserting anything
        # about real-world model performance. See ml-platform/README.md
        # and docs/ml_documentation.md for how to point src/train.py at
        # the real dataset (not committed to this repo) to train and
        # evaluate an actual candidate model.
        run: echo "See tests/test_pipeline_smoke.py docstrings — no dataset download performed or required here."
