# OvaCare AI — routing.
#
# Three surfaces behind one nginx: the patient-facing web app at /, the
# admin portal at /admin/, and the backend API at /api/. All three are
# already designed to work this way — apps/web/src/config.js and
# admin/dashboard/config.js both default API_BASE_URL to
# http://localhost:8000/api/v1 for local dev, but read a localStorage
# override, so a deployed build can point them at /api/v1 (same-origin,
# via this proxy) instead without a code change.
#
# This file assumes it's mounted into an nginx container alongside the
# built repo (see the volumes/build notes below) — it has NOT been run
# against a live nginx in this project's development sandbox, because the
# sandbox's Docker daemon doesn't start in this nested-container
# environment (see docs/deployment.md). It was written to the same
# standard as the rest of the infrastructure/ configs: real, deployable
# syntax, not a placeholder.

server {
    listen 80;
    server_name _;

    # --- Backend API ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # JWT bearer tokens travel in the Authorization header, not cookies —
        # nothing here needs to rewrite or forward cookies for auth to work.
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # --- Admin portal (admin/dashboard/) ---
    # RBAC is enforced server-side by every /admin/* API call
    # (require_admin) — this location block only serves static files, it
    # is not itself an access-control boundary. Restrict at the network
    # layer too in a real deployment (e.g. an allowlist or VPN-only
    # binding for this location) as defense in depth, since a static HTML
    # shell is trivially reachable by anyone who has the URL.
    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- Patient-facing web app (apps/web/src/) ---
    location / {
        root /usr/share/nginx/web;
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html itself (so a redeploy is picked up
    # immediately); static assets under long-lived, hashed-free filenames
    # get a short cache in this no-build-step setup rather than a
    # long one, since there's no content hash in the filename to bust it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }
}
