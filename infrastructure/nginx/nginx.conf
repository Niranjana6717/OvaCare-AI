# OvaCare AI — nginx entrypoint config.
#
# Includes conf.d/ovacare.conf, which does the actual routing (API proxy +
# static file serving for apps/web and admin/dashboard). Split this way so
# ovacare.conf can be mounted/edited independently of the base directives
# below, which rarely change.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # request_id-correlated access log — matches the request_id the backend
    # attaches to its own error responses (backend/app/middleware/error_handling.py),
    # so a single id can be grepped across nginx and backend logs together.
    log_format ovacare '$remote_addr - [$time_local] "$request" '
                        'status=$status bytes=$body_bytes_sent '
                        'referer="$http_referer" ua="$http_user_agent" '
                        'req_time=$request_time';
    access_log  /var/log/nginx/access.log ovacare;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Never let nginx itself echo verbose upstream error bodies to the
    # client on a 5xx — matches the backend's own "generic message,
    # detail logged server-side only" policy (requirement #47).
    proxy_intercept_errors on;

    include /etc/nginx/conf.d/*.conf;
}
